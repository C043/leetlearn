services:
  db:
    image: postgres:15-alpine
    container_name: leetlearn-db
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: leetlearn
      POSTGRES_PASSWORD: leetlearn_pass
      POSTGRES_DB: leetlearn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetlearn -d leetlearn_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetlearn-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://leetlearn:leetlearn_pass@db:5432/leetlearn_db?schema=public"
      NODE_ENV: "production"
      # Optional, for streak reminders (Apple rejects localhost subjects)
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:leetlearn@example.com}"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --skip-generate &&
             npx prisma db seed &&
             npm run start"

volumes:
  postgres_data:
